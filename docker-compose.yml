services:
  postgres:
    image: postgres:16-alpine
    container_name: joapycore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: joapycore
      POSTGRES_PASSWORD: joapycore
      POSTGRES_DB: joapycore
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: joapycore-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: joapycore
      MINIO_ROOT_PASSWORD: joapycore123
    ports:
      - "9000:9000" # API (S3_ENDPOINT)
      - "9001:9001" # Consola web
    volumes:
      - minio_data:/data

  maildev:
    image: maildev/maildev
    container_name: joapycore-maildev
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (SMTP_HOST=localhost SMTP_PORT=1025)
      - "1080:1080" # Web UI para ver los emails recibidos

volumes:
  postgres_data:
  minio_data:

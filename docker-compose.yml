services:
  redis:
    image: redis:7-alpine
    container_name: joapycore-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:16-alpine
    container_name: joapycore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: joapycore
      POSTGRES_PASSWORD: joapycore
      POSTGRES_DB: joapycore
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: joapycore-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: joapycore
      MINIO_ROOT_PASSWORD: joapycore123
    ports:
      - "9000:9000" # API (S3_ENDPOINT)
      - "9001:9001" # Consola web
    volumes:
      - minio_data:/data

  maildev:
    image: maildev/maildev
    container_name: joapycore-maildev
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (SMTP_HOST=localhost SMTP_PORT=1025)
      - "1080:1080" # Web UI para ver los emails recibidos

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: joapycore-gotenberg
    restart: unless-stopped
    ports:
      - "3009:3000" # HTTP (GOTENBERG_URL=http://localhost:3009) — convierte plantillas .docx a PDF (LibreOffice headless dentro del contenedor, sin instalarlo en la máquina)

volumes:
  redis_data:
  postgres_data:
  minio_data:

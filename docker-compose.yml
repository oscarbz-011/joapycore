services:
  postgres:
    image: postgres:16-alpine
    container_name: joapycore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: joapycore
      POSTGRES_PASSWORD: joapycore
      POSTGRES_DB: joapycore
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

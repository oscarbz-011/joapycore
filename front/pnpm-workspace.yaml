# No es un monorepo: front/ es un único paquete. pnpm 10 exige `packages:`
# en este archivo para reconocer cualquier comando (`pnpm run`, `pnpm exec`,
# incluso `pnpm help`) apenas el archivo existe — sin esto, pnpm falla con
# "packages field missing or empty" para todo, no solo para el comando que
# se quiera correr.
packages:
  - .

# Parches de seguridad para dependencias transitivas (pnpm audit, 13/09/2026;
# sharp y source-map-js, 07/10/2026).
# Cada override queda acotado a la misma versión mayor que ya resolvía el
# lockfile: `pnpm audit --fix` genera rangos abiertos (">=x") que suben de
# major (brace-expansion 1→5, js-yaml 4→5, nanoid 3→6) y rompen a quien los usa.
allowBuilds:
  esbuild: true
  unrs-resolver: false

overrides:
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=5.0.0 <5.0.11: ^5.0.11
  browserslist@<4.28.7: ^4.28.7
  fast-uri@<3.1.6: ^3.1.6
  hono@<4.13.5: ^4.13.5
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid@<3.3.18: ^3.3.18
  postcss@<8.5.23: ^8.5.23
  qs@<6.16.0: ^6.16.0
  sharp@<0.35.5: ^0.35.5
  source-map-js@<1.2.2: ^1.2.2
  baseline-browser-mapping@<2.11.0: ^2.11.0
  undici@>=7.0.0 <7.29.1: ^7.29.1

# Parches de seguridad para dependencias transitivas (pnpm audit, 13/09/2026).
# Cada override queda acotado a la misma versión mayor que ya resolvía el
# lockfile: `pnpm audit --fix` genera rangos abiertos (">=x") que suben de
# major (brace-expansion 1→5, js-yaml 4→5, nanoid 3→6) y rompen a quien los usa.
overrides:
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=5.0.0 <5.0.9: ^5.0.9
  browserslist@<4.28.7: ^4.28.7
  fast-uri@<3.1.6: ^3.1.6
  hono@<4.13.5: ^4.13.5
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid@<3.3.18: ^3.3.18
  postcss@<8.5.23: ^8.5.23
  qs@<6.16.0: ^6.16.0
  sharp@<0.35.4: ^0.35.4
  baseline-browser-mapping@<2.11.0: ^2.11.0
